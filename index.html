<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>PsykødeliA TeknøRadiø™</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0a; font-family:'Courier New',monospace; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
    
    .radio-body {
      position:absolute; top:0; left:0; width:100%; height:100%; z-index:10;
      background:#0a0a0a;
      display:flex; flex-direction:column; align-items:center; justify-content:space-between;
      padding:3vh 0 3vh 0; overflow:hidden;
    }

    /* LOGO PRINCIPAL */
    .logo-top-container {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100px;
      width:100%;
      padding:2vh 5%;
      margin:1vh 0;
      z-index:15;
    }
    .logo-top-container img {
      max-height:110px;
      width:auto;
      object-fit:contain;
      filter: drop-shadow(0 0 15px rgba(0,255,255,0.5));
      transition: all 0.3s ease;
    }

    /* PANTALLA VISUALIZADOR */
    .display-screen { 
      width:95%; 
      height:40%; 
      max-height:45vh; 
      background:#0d0d0d;
      border:2px solid #00ffff;
      box-shadow:0 0 20px rgba(0,255,255,0.3);
      display:flex; 
      flex-direction:column; 
      align-items:center; 
      justify-content:center; 
      position:relative; 
      overflow:hidden; 
      cursor:pointer;
      margin:2vh 0;
      border-radius:8px;
    }
    .visualizer-canvas { width:100%; height:100%; position:absolute; top:0; left:0; }
    .status-message { 
      position:absolute; bottom:10%; left:0; width:100%; text-align:center; 
      font-size:clamp(0.6rem, 2.2vw, 0.9rem); color:#00ffff; 
      text-shadow:0 0 15px #00ffff; 
      letter-spacing:2px; font-weight:bold; pointer-events:none; z-index:10; 
    }

    /* BOTONES DE MODO */
    .mode-selectors { display:flex; gap:1.5rem; margin:1vh 0; z-index:20; }
    .mode-btn { 
      background:#1a1a1a; 
      border:2px solid #333; 
      border-radius:12px; 
      padding:0.5rem 1.2rem; 
      font-family:'Courier New',monospace; 
      font-weight:bold; 
      font-size:clamp(0.7rem, 2vw, 0.9rem); 
      letter-spacing:2px; 
      color:#666; 
      cursor:pointer; 
      transition:all 0.2s ease; 
      text-transform:lowercase; 
      outline:none; 
    }
    .mode-btn.active { 
      color:#00ffff; 
      text-shadow:0 0 12px #00ffff; 
      border-color:#00ffff; 
      box-shadow:0 0 15px rgba(0,255,255,0.5); 
    }

    /* BOTÓN CAFÉ/PAYPAL */
    .paypal-btn { 
      position:absolute; bottom:12px; left:12px; 
      background:rgba(0,255,255,0.1); 
      color:#00ffff; 
      padding:4px 10px; 
      border-radius:12px; 
      text-decoration:none; 
      font-size:0.7rem; 
      border:1px solid rgba(0,255,255,0.3); 
      z-index:25; 
      letter-spacing:0.5px; 
      cursor:pointer; 
      transition:0.2s; 
    }
    .paypal-btn:hover { background:rgba(0,255,255,0.2); }

    @media (max-width:400px) {
      .radio-body { padding:2vh 0; }
      .mode-btn { padding:0.3rem 0.7rem; font-size:0.65rem; }
      .display-screen { height:60%; }
      .logo-top-container { min-height:70px; padding:1vh 5%; }
      .logo-top-container img { max-height:80px; }
    }

    @media (min-width:768px) {
      .logo-top-container img { max-height:130px; }
      .display-screen { height:45%; }
    }
  </style>
</head>
<body>
  <div class="radio-body" role="application">
    <!-- LOGO PRINCIPAL -->
    <div id="logoTopContainer" class="logo-top-container">☢️</div>

    <!-- PANTALLA VISUALIZADOR -->
    <div class="display-screen" id="screenBtn">
      <canvas class="visualizer-canvas" id="vizCanvas"></canvas>
      <div class="status-message" id="statusMessage">ACEPTA LOS TÉRMINOS PRIMERO</div>
    </div>

    <!-- BOTONES DE MODO -->
    <div class="mode-selectors">
      <button class="mode-btn active" id="btnMix">MiX</button>
      <button class="mode-btn" id="btnPlaylist">SET</button>
    </div>
    
    <!-- BOTÓN CAFÉ -->
    <a class="paypal-btn" href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=dlr.ruby@gmail.com&item_name=Donaci%C3%B3n+PsikodeliA+TeknoRadio&currency_code=EUR" target="_blank" rel="noopener noreferrer">☕</a>
  </div>

  <!-- MODAL LEGAL -->
  <div class="legal-modal" id="legalModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; display:flex; align-items:center; justify-content:center; color:#fff;">
    <div style="background:#111; border:2px solid #00ffff; border-radius:20px; padding:2rem; max-width:350px; text-align:center; font-family:'Courier New',monospace;">
      <h2 style="color:#00ffff; margin-bottom:1rem;">PsykodeliA TeknoRadio™</h2>
      <p style="font-size:0.8rem; margin:0.5rem 0; line-height:1.4;">Usamos cookies técnicas para el reproductor.</p>
      <p style="font-size:0.8rem; margin:0.5rem 0; line-height:1.4;">Al continuar aceptas nuestra Política de Privacidad y Términos de Uso.</p>
      <p style="font-size:0.8rem; margin:0.5rem 0; line-height:1.4;">Si quieres puedes apoyar el proyecto ☕.</p>
      <button id="acceptLegalBtn" style="background:#00ffff; border:none; color:#000; font-weight:bold; padding:0.7rem 2rem; border-radius:30px; cursor:pointer; margin-top:1rem; font-family:'Courier New',monospace; box-shadow:0 0 15px rgba(0,255,255,0.5); font-size:1rem;">Aceptar</button>
    </div>
  </div>

  <script src="ap.js"></script>
</body>
</html>
